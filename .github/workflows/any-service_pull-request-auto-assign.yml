name: Auto Assign
permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types:
      - opened
      - ready_for_review

jobs:
  add-assigne:
    runs-on: ubuntu-latest
    steps:
      - uses: kentaro-m/auto-assign-action@0a2c53d3721e4c5cfcce6afd4014aecc337979f6 # v2.0.2
        with:
          configuration-path: '.github/auto_assign.yml'
