name: callable build and push docker image for frontend

on:
  workflow_call:
    inputs:
      tag:
        required: false
        default: ''
        type: string
        description: 'optional tag that is used for build; default: github.ref'
      service:
        required: true
        type: string
        description: 'name of service to use'

env:
  REGISTRY: ghcr.io

jobs:
  build:
    permissions:
      packages: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: './${{ inputs.service }}'
    steps:
      - name: Check out Git repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.tag || github.ref}}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: '${{ inputs.service }}/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build Vue application
        run: npm run build

      - name: Log in to the Container registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ inputs.service }}
          context: git
          # tags:
          # - Major
          # - Major.Minor
          # - Major.Minor.Patch
          # - full semver: 1.2.3-RC2
          # - latest
          tags: |
            type=match,pattern=(${{ inputs.service }})/(\d).\d.\d,group=2,enable=${{ inputs.tag != '' }}
            type=match,pattern=(${{ inputs.service }})/(\d.\d).\d,group=2,enable=${{ inputs.tag != '' }}
            type=match,pattern=(${{ inputs.service }})/(\d.\d.\d),group=2,enable=${{ inputs.tag != '' }}
            type=match,pattern=(${{ inputs.service }})/(.*),group=2,enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable=${{ inputs.tag != '' }}
            type=raw,value=latest-dev

      - name: Build and push image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./${{ inputs.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}