name: callable build and push docker image for frontend

on:
  workflow_call:
    inputs:
      tag:
        required: false
        default: ''
        type: string
        description: 'optional tag that is used for build; default: github.ref'
      service:
        required: true
        type: string
        description: 'name of service to use'

env:
  REGISTRY: ghcr.io

jobs:
  build:
    permissions:
      packages: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: './${{ inputs.service }}'
    steps:
      - name: Check out Git repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.tag || github.ref}}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: '${{ inputs.service }}/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build Vue application
        run: npm run build

      - name: Log in to the Container registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ inputs.service }}
          context: git
          # tags:
          # - Major
          # - Major.Minor
          # - Major.Minor.Patch
          # - full semver: 1.2.3-RC2
          # - latest
          tags: |
            type=match,pattern=(${{ inputs.service }})/(\d+).\d+.\d+,group=2,enable=${{ inputs.tag != '' }}
            type=match,pattern=(${{ inputs.service }})/(\d+.\d+).\d+,group=2,enable=${{ inputs.tag != '' }}
            type=match,pattern=(${{ inputs.service }})/(\d+.\d+.\d+),group=2,enable=${{ inputs.tag != '' }}
            type=match,pattern=(${{ inputs.service }})/(.*),group=2,enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable=${{ inputs.tag != '' }}
            type=raw,value=latest-dev

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./${{ inputs.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}