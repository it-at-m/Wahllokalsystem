name: callable build and push docker image for frontend

on:
  workflow_call:
    inputs:
      tag:
        required: false
        default: ''
        type: string
        description: 'optional tag that is used for build; default: github.ref'
      service:
        required: true
        type: string
        description: 'name of service to use'

env:
  REGISTRY: ghcr.io

jobs:
  build:
    permissions:
      packages: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: './${{ inputs.service }}'
    steps:
      - name: Check out Git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag || github.ref}}

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: '${{ inputs.service }}/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build Vue application
        run: npm run build

      - name: Log in to the Container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ inputs.service }}
          context: git
          # tags:
          # - Major
          # - Major.Minor
          # - Major.Minor.Patch
          # - full semver: 1.2.3-RC2
          # - latest
          tags: |
            type=match,pattern=(${{ inputs.service }})/(\d+).\d+.\d+,group=2,enable=${{ inputs.tag != '' }}
            type=match,pattern=(${{ inputs.service }})/(\d+.\d+).\d+,group=2,enable=${{ inputs.tag != '' }}
            type=match,pattern=(${{ inputs.service }})/(\d+.\d+.\d+),group=2,enable=${{ inputs.tag != '' }}
            type=match,pattern=(${{ inputs.service }})/(.*),group=2,enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable=${{ inputs.tag != '' }}
            type=raw,value=latest-dev

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ inputs.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}