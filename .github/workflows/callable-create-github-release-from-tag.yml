name: callable build github release from tag
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: 'tag that is used for build'
      service:
        required: true
        type: string
        description: 'name of service to use'
      files:
        required: true
        type: string
        description: 'Newline-delimited globs of paths to assets to upload for release'
      javaVersion:
        required: false
        default: '17'
        type: string
        description: 'java version to use for build'

env:
  REGISTRY: ghcr.io

jobs:
  create-github-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:

      - name: Check out Git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag }}

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          cache: 'maven'
          cache-dependency-path: '${{ inputs.service }}/pom.xml'
          java-version: ${{ inputs.javaVersion }}
          distribution: 'temurin'

      - name: build jar without tests
        run: mvn -B -ntp -DskipTests verify -f ${{ inputs.service }}/pom.xml

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ inputs.files }}
          tag_name: ${{ inputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: false