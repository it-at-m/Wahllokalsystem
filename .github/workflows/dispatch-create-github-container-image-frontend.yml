name: dispatch build github container image for frontend

on:
  workflow_dispatch:
    inputs:
      service:
        required: true
        type: choice
        description: frontend-service/directory to build (wls-gui-wahllokalsystem, ...)
        options:
          - wls-gui-wahllokalsystem
      tag:
        required: false
        description: 'optional: gittag'

jobs:
  build-github-container-image-frontend:
    permissions:
      packages: write
    uses:
      ./.github/workflows/callable-create-github-container-image-frontend.yml
    with:
      tag: ${{ github.event.inputs.tag }}
      service: ${{ github.event.inputs.service }}