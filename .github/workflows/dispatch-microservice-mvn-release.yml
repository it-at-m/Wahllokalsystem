name: dispatch microservice maven release

on:
  workflow_dispatch:
    inputs:
      release-version:
        required: true
        description: release version to build
      development-version:
        required: true
        description: next development version to set
      service:
        required: true
        type: choice
        description: service/directory to build (wls-broadcast-service, ...)
        options:
          - wls-api-gateway
          - wls-admin-service
          - wls-auth-service
          - wls-basisdaten-service
          - wls-briefwahl-service
          - wls-broadcast-service
          - wls-eai-service
          - wls-ergebnismeldung-service
          - wls-infomanagement-service
          - wls-monitoring-service
          - wls-vorfaelleundvorkommnisse-service
          - wls-wahlvorbereitung-service
          - wls-wahlvorstand-service
      javaVersion:
        required: true
        type: string
        default: '21'
        description: "java version für den Build"

jobs:
  run-mvn-release-prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out Git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup git user
        uses: fregante/setup-git-user@024bc0b8e177d7e77203b48dab6fb45666854b35 # v2.0.2
      - name: Install Java and Maven
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: ${{ github.event.inputs.javaVersion }}
          distribution: "temurin"
          cache: 'maven'
          cache-dependency-path: '${{ github.event.inputs.service }}/pom.xml'
      - name: Perform maven release
        run: >
          mvn -B -ntp release:prepare -f ${{ github.event.inputs.service }}/pom.xml
          -DreleaseVersion=${{ github.event.inputs.release-version }} 
          -DdevelopmentVersion=${{ github.event.inputs.development-version }} 
          -Dtag=${{ github.event.inputs.service }}/${{ github.event.inputs.release-version }}
          -Darguments="-DskipTests"

  build-github-release:
    permissions:
      contents: write
    needs:
      - run-mvn-release-prepare
    uses:
      ./.github/workflows/callable-create-github-release-from-tag.yml
    with:
      tag: ${{ github.event.inputs.service }}/${{ github.event.inputs.release-version }}
      service: ${{ github.event.inputs.service }}
      files: "${{ github.event.inputs.service }}/target/*.jar\n${{ github.event.inputs.service }}/target/openapi.json"
      javaVersion: ${{ github.event.inputs.javaVersion }}

  build-github-container-image:
    permissions:
      packages: write
    needs:
      - run-mvn-release-prepare
    uses:
      ./.github/workflows/callable-create-github-container-image.yml
    with:
      tag: ${{ github.event.inputs.service }}/${{ github.event.inputs.release-version }}
      service: ${{ github.event.inputs.service }}
      javaVersion: ${{ github.event.inputs.javaVersion }}
