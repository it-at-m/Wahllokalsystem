name: verify pull request docs

on:
  pull_request:
    paths:
      - 'docs/**'

jobs:
  run-docs-build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docs
    steps:
      - id: build_docs
        uses: it-at-m/lhm_actions/action-templates/actions/action-build-docs@808f574bd8867b31524b254679fc34fb1fd78ea2 # v1.6.2