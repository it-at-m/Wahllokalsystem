name: verify pull request docs

on:
  pull_request:
    paths:
      - 'docs/**'

jobs:
  run-docs-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docs
    steps:
      - id: build_docs
        uses: it-at-m/lhm_actions/action-templates/actions/action-build-docs@a4dd26733adc7d71b10fbd744ef355c01e4b7040 # v1.0.8