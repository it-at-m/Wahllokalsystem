name: build push default branch api-gateway

on:
  push:
    branches:
      - main
    paths:
      - 'wls-api-gateway/**'
      - '.github/workflows/wls-api-gateway_push-default_branch.yml'

jobs:
  build-github-container-image:
    permissions:
      packages: write
    uses:
      ./.github/workflows/callable-create-github-container-image.yml
    with:
      service: 'wls-api-gateway'
      javaVersion: '21'
