name: build push dev api-gateway

on:
  push:
    branches:
      - dev
    paths:
      - 'wls-api-gateway/**'
      - '.github/workflows/wls-api-gateway_push-dev.yml'

jobs:
  build-github-container-image:
    permissions:
      packages: write
    uses:
      ./.github/workflows/callable-create-github-container-image_java21.yml
    with:
      service: 'wls-api-gateway'
