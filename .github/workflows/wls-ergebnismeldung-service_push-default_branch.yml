name: build push default branch ergebnismeldung-service

on:
  push:
    branches:
      - main
    paths:
      - 'wls-ergebnismeldung-service/**'
      - '.github/workflows/wls-ergebnismeldung-service_push-default_branch.yml'

jobs:
  build-github-container-image:
    permissions:
      packages: write
    uses:
      ./.github/workflows/callable-create-github-container-image.yml
    with:
      service: 'wls-ergebnismeldung-service'
      javaVersion: '21'