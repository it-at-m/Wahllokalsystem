name: build push default branch gui admintool

on:
  push:
    branches:
      - main
    paths:
      - 'wls-gui-admintool/**'
      - '.github/workflows/wls-gui-admintool_push-default_branch.yml'

jobs:
  build-github-container-image:
    permissions:
      packages: write
    uses:
      ./.github/workflows/callable-create-github-container-image-frontend.yml
    with:
      service: 'wls-gui-admintool'