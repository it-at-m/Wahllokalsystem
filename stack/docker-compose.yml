      - SPRING_DATASOURCE_URL=${WLS_BROADCAST_SERVICE_DB_URL}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI=${SSO_JWK_URI}
      - SECURITY_OAUTH2_RESOURCE_USER-INFO-URI=${SSO_USER_INFO_URI}
      - SERVER_PORT=8080
    ports:
      - 8200:8080
    extra_hosts:
      - "kubernetes.docker.internal:host-gateway"
    networks:
