      - services

  ### Infrastruktur erfassen
  wls-db-oracle:
    container_name: wls-db-oracle
    image: gvenzl/oracle-xe:21-faststart
    ports:
      - 1521:1521
    environment:
      ORACLE_PASSWORD: secret
      APP_USER: app_user
      APP_USER_PASSWORD: secret
    volumes:
      - './oracle-database:/container-entrypoint-startdb.d'
    networks:
      - services

  refarch-gateway:
    image: ghcr.io/it-at-m/refarch/refarch-gateway:1.3.1@sha256:702d063d7141bb79af0107956b699c7771d0a91128f7622bdadc771911b94fca
    env_file:
      - .env
    ports:
      - "8083:8080"
    environment:
      - ALLOWED_ORIGINS_PUBLIC=http://localhost:*
      - ALLOWED_ORIGINS_CLIENTS=http://localhost:*
      - SPRING_CONFIG_ADDITIONAL_LOCATION=/config/application-routes.yml
      - SPRING_PROFILES_ACTIVE=hazelcast-local
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI=${SSO_USER_INFO_URI}
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_SSO_ISSUERURI=http://kubernetes.docker.internal:8100
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SSO_PROVIDER=sso
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SSO_CLIENTID=${SSO_CLIENT_ID}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SSO_CLIENTSECRET=${SSO_CLIENT_SECRET}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SSO_SCOPE=openid
    volumes:
      - './gateway_config:/config'
    networks:
      - services
    extra_hosts:
      - "kubernetes.docker.internal:host-gateway"
    healthcheck:
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 60s
      test: [ "CMD-SHELL", "curl http://localhost:8080/actuator/health/liveness" ]
    security_opt:
      - no-new-privileges:true

  wls-auth-service:
    container_name: wls-auth-service
    image: ghcr.io/it-at-m/wahllokalsystem-wls-auth-service:latest
    depends_on:
      - wls-db-oracle
    env_file:
      - .env
    environment:
      - SERVICE_CONFIG_CRYPTO_KEY=please change me
      - SERVICE_CONFIG_OAUTH2_CLIENTS_WAHLLOKALGUI_ID=${SSO_CLIENT_ID}
      - SERVICE_CONFIG_OAUTH2_JWK_RSA_INIT_SEED=change_me
      - SPRING_PROFILES_ACTIVE=${WLS_AUTH_SERVICE_PROFILE}
      - SPRING_DATASOURCE_URL=${WLS_AUTH_SERVICE_DB_URL}
      - SERVER_PORT=8080
    ports:
      - 8100:8080
    networks:
      - services

networks:
  internal:
  services: