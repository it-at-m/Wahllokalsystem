      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=db-oracle,plainTextLogging
      - SPRING_DATASOURCE_URL=${WLS_SERVICE_DB_URL}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI=${SSO_JWK_URI}
      - SECURITY_OAUTH2_RESOURCE_USER-INFO-URI=${SSO_USER_INFO_URI}
      - SERVER_PORT=8080
      - APP_CLIENTS_EAI_BASEPATH=http://host.docker.internal:8300
      - APP_CLIENTS_INFOMANAGEMENT_BASEPATH=http://host.docker.internal:8201
      - APP_CLIENTS_BASISDATEN_BASEPATH=http://host.docker.internal:8205
    ports:
      - 8207:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - services

  wls-ergebnismeldung-service:
    container_name: wls-ergebnismeldung-service
    image: wahllokalsystem-wls-ergebnismeldung-service:local
    build:
      context: ../wls-ergebnismeldung-service
      dockerfile: Dockerfile
    depends_on:
      wls-db-oracle:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=db-oracle,plainTextLogging
      - SPRING_DATASOURCE_URL=${WLS_SERVICE_DB_URL}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI=${SSO_JWK_URI}
      - SECURITY_OAUTH2_RESOURCE_USER-INFO-URI=${SSO_USER_INFO_URI}
      - SERVER_PORT=8080
      - SERVICE_CONFIG_CLIENTS_EAI_BASEPATH=http://host.docker.internal:8300
      - SERVICE_CONFIG_CLIENTS_MONITORING_BASEPATH=http://host.docker.internal:8206
      - SERVICE_CONFIG_CLIENTS_INFOMANAGEMENT_BASEPATH=http://host.docker.internal:8201
      - SERVICE_CONFIG_CLIENTS_BASISDATEN_BASEPATH=http://host.docker.internal:8205
      - SERVICE_CONFIG_CLIENTS_BRIEFWAHL_BASEPATH=http://host.docker.internal:8202
      - SERVICE_CONFIG_CLIENTS_WAHLVORBEREITUNG_BASEPATH=http://host.docker.internal:8203
    ports:
      - 8208:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - services

  wls-admin-service:
    container_name: wls-admin-service
    image: wahllokalsystem-wls-admin-service:local
    build:
      context: ../wls-admin-service
      dockerfile: Dockerfile
    depends_on:
      wls-db-oracle:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=db-oracle,plainTextLogging
      - SPRING_DATASOURCE_URL=${WLS_SERVICE_DB_URL}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI=${SSO_JWK_URI}
      - SECURITY_OAUTH2_RESOURCE_USER-INFO-URI=${SSO_USER_INFO_URI}
      - SERVER_PORT=8080
      - SERVICE_CONFIG_CLIENTS_AUTH_BASEPATH=http://host.docker.internal:8100
      - SERVICE_CONFIG_CLIENTS_BASISDATEN_BASEPATH=http://host.docker.internal:8205
      - SERVICE_CONFIG_CLIENTS_INFOMANAGEMENT_BASEPATH=http://host.docker.internal:8201
      - SERVICE_CONFIG_CLIENTS_ERGEBNISMELDUNG_BASEPATH=http://host.docker.internal:8208
    ports:
      - 8209:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - services

  wls-eai-service:
    container_name: wls-eai-service
    image: wahllokalsystem-wls-eai-service:local
    build:
      context: ../wls-eai-service
      dockerfile: Dockerfile
    depends_on:
      wls-db-oracle:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=db-oracle,db-dummydata,plainTextLogging
      - SPRING_DATASOURCE_URL=${WLS_SERVICE_DB_URL}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI=${SSO_JWK_URI}
      - SECURITY_OAUTH2_RESOURCE_USER-INFO-URI=${SSO_USER_INFO_URI}
      - SERVER_PORT=8080
    ports:
      - 8300:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - services

  ### Infrastruktur erfassen
  wls-db-oracle:
    container_name: wls-db-oracle
    image: gvenzl/oracle-xe:21-faststart@sha256:62b2c30de9d5b76f8083688e3124db0691073d16fa072a5efe9c7d90c4962f1a
    ports:
      - 1521:1521
    environment:
      ORACLE_PASSWORD: secret
      APP_USER: app_user
      APP_USER_PASSWORD: secret
    volumes:
      - './oracle-database:/container-entrypoint-startdb.d'
    networks:
      - services
    healthcheck:
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 120s
      test: [ "CMD-SHELL", "/opt/oracle/healthcheck.sh" ]

  refarch-gateway-wls:
    container_name: wls-refarch-gateway-wls
    image: wahllokalsystem-wls-api-gateway:local
    build:
      context: ../wls-api-gateway
      dockerfile: Dockerfile
    depends_on:
      wls-auth-service:
        condition: service_healthy
      wls-auth-service-reverse-proxy:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8083:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_CONFIG_ADDITIONAL_LOCATION=/config/application-routes.yml
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI=${SSO_USER_INFO_URI}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SSO_PROVIDER=sso
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SSO_CLIENTID=${SSO_CLIENT_ID_WLS}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SSO_CLIENTSECRET=${SSO_CLIENT_SECRET}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SSO_SCOPE=openid
      - JAVA_TOOL_OPTIONS=-Djavax.net.ssl.trustStore=/config_ssl/truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=PKCS12 -Dserver.ssl.enabled=false
    volumes:
      - './gateway_config_wls:/config'
      - './reverse-proxy-auth-service/ssl:/config_ssl' # Pfad zum Reverseproxy da dort die Certs und der Truststore liegen (siehe JAVA_TOOL_OPTIONS)
    networks:
      - services
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "gui.wls.host.docker.internal:host-gateway"
      - "auth.wls.host.docker.internal:host-gateway"
    healthcheck:
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 120s
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health" ]
    security_opt:
      - no-new-privileges:true

  refarch-gateway-admin:
    container_name: wls-refarch-gateway-admin
    image: wahllokalsystem-wls-api-gateway:local
    build:
      context: ../wls-api-gateway
      dockerfile: Dockerfile
    depends_on:
      wls-auth-service:
        condition: service_healthy
      wls-auth-service-reverse-proxy:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8084:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_CONFIG_ADDITIONAL_LOCATION=/config/application-routes.yml
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI=${SSO_USER_INFO_URI}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SSO_PROVIDER=sso
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SSO_CLIENTID=${SSO_CLIENT_ID_ADMIN}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SSO_CLIENTSECRET=${SSO_CLIENT_SECRET}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SSO_SCOPE=openid
      - JAVA_TOOL_OPTIONS=-Djavax.net.ssl.trustStore=/config_ssl/truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=PKCS12 -Dserver.ssl.enabled=false
    volumes:
      - './gateway_config_admin:/config'
      - './reverse-proxy-auth-service/ssl:/config_ssl' # Pfad zum Reverseproxy da dort die Certs und der Truststore liegen (siehe JAVA_TOOL_OPTIONS)
    networks:
      - services
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "gui.wls.host.docker.internal:host-gateway"
      - "auth.wls.host.docker.internal:host-gateway"
    healthcheck:
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 120s
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health" ]
    security_opt:
      - no-new-privileges:true

  wls-auth-service:
    container_name: wls-auth-service
    image: wahllokalsystem-wls-auth-service:local
    build:
      context: ../wls-auth-service
      dockerfile: Dockerfile
    depends_on:
      wls-db-oracle:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SERVICE_CONFIG_CRYPTO_KEY: please change me
      SERVICE_CONFIG_OAUTH2_CLIENTS_WAHLLOKALGUI_ID: ${SSO_CLIENT_ID_WLS}
      SERVICE_CONFIG_OAUTH2_JWK_RSA_INIT_SEED: change_me
      SPRING_LDAP_EMBEDDED_LDIF: file:/configLdap/users.ldif
      SPRING_PROFILES_ACTIVE: db-oracle,db-dummydata,dummy.ldap,plainTextLogging
      SPRING_DATASOURCE_URL: ${WLS_SERVICE_DB_URL}
      SERVER_PORT: 8080
      SERVICE_CONFIG_CLIENTS_INFOMANAGEMENT_BASEPATH: http://host.docker.internal:8201
      SERVICE_CONFIG_RSA_RSA_KEY_SETTING: STATIC_KEY
      SERVICE_CONFIG_RSA_PRIVATE-KEY: |
