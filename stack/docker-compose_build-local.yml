      start_period: 120s
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health" ]

  wls-gui-wahllokalsystem:
    container_name: wls-gui-wahllokalsystem
    image: wahllokalsystem-wls-gui-wahllokalsystem:local
    build:
      context: ../wls-gui-wahllokalsystem
      dockerfile: Dockerfile
    ports:
      - 8400:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - services

  wls-gui-admintool:
    container_name: wls-gui-admintool
    image: wahllokalsystem-wls-gui-admintool:local
    build:
      context: ../wls-gui-admintool
      dockerfile: Dockerfile
    ports:
      - 8401:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - services

  wls-refarch-gateway-wls-reverse-proxy:
    container_name: wls-refarch-gateway-wls-reverse-proxy
    image: nginx:alpine@sha256:2f07d83bf561b506400dc183b1b2003803e39efbd22451f848adaba14d28c7c7
    ports:
      - "58083:443"
    volumes:
      - ./reverse-proxy-gui-wls/ssl:/etc/nginx/ssl
      - ./reverse-proxy-gui-wls/nginx.conf:/etc/nginx/conf.d/default.conf
    restart: always

  wls-auth-service-reverse-proxy:
    container_name: wls-auth-service-reverse-proxy
    image: nginx:alpine@sha256:2f07d83bf561b506400dc183b1b2003803e39efbd22451f848adaba14d28c7c7
    ports:
      - "58100:443"
    volumes:
      - ./reverse-proxy-auth-service/ssl:/etc/nginx/ssl
      - ./reverse-proxy-auth-service/nginx.conf:/etc/nginx/conf.d/default.conf
    restart: always
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      test: [ "CMD-SHELL", "curl -f --insecure https://localhost:443/nginx-health" ]

networks:
  internal:
  services: