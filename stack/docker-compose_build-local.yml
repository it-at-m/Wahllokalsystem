name: wls

services:
  ### WLS-Backend Services
  wls-broadcast-service:
    container_name: wls-broadcast-service
    image: wahllokalsystem-wls-broadcast-service:local
    build:
      context: ../wls-broadcast-service
      dockerfile: Dockerfile
    depends_on:
      wls-db-oracle:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=db-oracle,plainTextLogging
      - SPRING_DATASOURCE_URL=${WLS_SERVICE_DB_URL}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI=${SSO_JWK_URI}
      - SECURITY_OAUTH2_RESOURCE_USER-INFO-URI=${SSO_USER_INFO_URI}
      - SERVER_PORT=8080
    ports:
      - 8200:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - services

  wls-infomanagement-service:
    container_name: wls-infomanagement-service
    image: wahllokalsystem-wls-infomanagement-service:local
