
upstream wls_auth_backend {
    server wls-wls-auth-service-1:8080;
    server wls-wls-auth-service-2:8080;
    server wls-wls-auth-service-3:8080;
    server wls-wls-auth-service-4:8080;
    server wls-wls-auth-service-5:8080;
    server wls-wls-auth-service-6:8080;
    server wls-wls-auth-service-7:8080;
    server wls-wls-auth-service-8:8080;
    server wls-wls-auth-service-9:8080;
    server wls-wls-auth-service-10:8080;

    # Optional:
    # least_conn;
    # ip_hash;
}

server {
    listen 8080;
    server_name lb.auth.wls.host.docker.internal;

    location / {

        proxy_pass http://wls_auth_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
