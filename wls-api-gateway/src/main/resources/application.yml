spring:
  application:
    name: "@project.artifactId@"
    group: "@project.groupId@"
    version: "@project.version@"
  profiles:
    group:
      local:
        - plainTextLogging
  main:
    web-application-type: reactive
    banner-mode: console
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: ${ALLOWED_ORIGINS_CLIENTS}
                allowedHeaders: "*"
                allowCredentials: true
              '[/public/**]':
                allowedOriginPatterns: ${ALLOWED_ORIGINS_PUBLIC}
              '[/clients/**]':
                allowedOriginPatterns: ${ALLOWED_ORIGINS_CLIENTS}
                allowedHeaders: "*"
                allowCredentials: true
          default-filters:
            - RemoveRequestHeader=cookie
            - RemoveRequestHeader=x-xsrf-token
            - TokenRelay=
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  forward-headers-strategy: native
  error:
    include-message: always
    whitelabel:
      enabled: false


management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
          - sbom
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      access: read_only
      probes:
        enabled: true
    info:
      access: read_only
    prometheus:
      access: read_only
    sbom:
      access: read_only
  info:
    env:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    version: ${spring.application.version}
    group: ${spring.application.group}
    description: "@project.description@"
  build:
    java.version: "@java.version@"
    spring-cloud.version: "@spring-cloud-dependencies.version@"

service:
  info:
    oid: WLS-API-GATEWAY
  generic500Exception:
    code: "000"
    message: "unstructured foreign exception received"
