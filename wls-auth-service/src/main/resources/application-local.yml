spring:
  jpa:
    properties:
      hibernate:
        generate_statistics: true # when true, enable logger org.hibernate.engine.internal.StatisticalLoggingSessionEventListener with debug

server:
  port: 8100

service:
  config:
    crypto:
      key: "please change me"
    oauth2:
      jwk:
        rsa:
          init:
            seed: change_me

management:
  endpoints:
    access:
      default: read_only # Required for local debugging via JMX+RMI, additionally might have to set -Djava.rmi.server.hostname=localhost as JVM arguments