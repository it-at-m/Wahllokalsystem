spring:

  flyway:
    enabled: true
  # Spring JPA
  h2.console.enabled: true
  jpa:
    database: H2
    hibernate:
      ddl-auto: validate
      naming.physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    # Logging for database operation
    show-sql: true
    properties:
      hibernate:
        format_sql: true

service:
  config:
    crypto:
      key: "please change me"
    oauth2:
      jwk:
        rsa:
          init:
            seed: change_me