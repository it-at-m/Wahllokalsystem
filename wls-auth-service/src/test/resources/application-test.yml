spring:

  session:
    jdbc:
      table-name: SPRING_SESSION
  datasource:
    username: sa
    password:
    url: jdbc:h2:mem:wls-auth-service
  flyway:
    enabled: true
  # Spring JPA
  h2.console.enabled: true
  jpa:
    database: H2
    # Logging for database operation
    show-sql: true
    properties:
      hibernate:
        format_sql: true

service:
  config:
    crypto:
      key: "please change me"
    oauth2:
      jwk:
        rsa:
          init:
            seed: change_me