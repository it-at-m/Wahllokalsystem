spring:
  h2.console.enabled: true
  session:
    jdbc:
      table-name: SPRING_SESSION
  datasource:
    username: sa
    password:
    url: jdbc:h2:mem:wls-auth-service;DB_CLOSE_ON_EXIT=FALSE
  flyway:
    enabled: true
  jpa:
    database: H2
    hibernate:
      ddl-auto: validate
      naming.physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
    # Enable SQL logging for test environment only
    show-sql: true

refarch.gracefulshutdown.pre-wait-seconds: 0
